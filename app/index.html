<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B4B45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trident">
<title>Trident</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Home-screen launcher for the Trident app (the Apps Script web app).
     Your private app link is kept only on this phone (localStorage), never
     on this website. Add ?reset to the address to forget it. -->
<style>
  :root{--brand:#1B4B45;--ink:#FFFFFF;--muted:#C9D3DF;--figure:#8FD4BD}
  html,body{margin:0;height:100%;background:var(--brand);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F3F6F5;padding-top:env(safe-area-inset-top);box-sizing:border-box}
  .setup{box-sizing:border-box;min-height:100%;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 40px) 16px 32px;display:flex;flex-direction:column;gap:16px}
  .setup img{width:56px;height:56px}
  h1{margin:0;font-size:26px;line-height:1.15}
  p{margin:0;color:var(--muted)}
  label{font-weight:600}
  textarea{width:100%;box-sizing:border-box;min-height:96px;padding:12px;border-radius:8px;border:0;font:15px/1.4 ui-monospace,Menlo,monospace;color:#17221F}
  textarea:focus-visible,button:focus-visible{outline:3px solid var(--figure);outline-offset:2px}
  button{min-height:50px;border:0;border-radius:8px;background:var(--figure);color:#0E1A18;font:700 16px system-ui,sans-serif;cursor:pointer}
  .err{color:#FFD1C7;font-weight:600}
  ol{margin:0;padding-left:20px;color:var(--muted)}
  li{margin-bottom:4px}
  .sheet{position:fixed;inset:0;z-index:10;background:rgba(14,26,24,.55);display:flex;align-items:flex-end;justify-content:center}
  .sheet .box{width:100%;max-width:520px;box-sizing:border-box;background:#FFFFFF;color:#17221F;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  .sheet h2{margin:0;font-size:17px}
  .sheet p{color:#55625E;font-size:14px;max-height:30vh;overflow:auto;white-space:pre-wrap}
  .sheet a,.sheet button{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:8px;font:700 16px system-ui,sans-serif;text-decoration:none}
  .sheet a{background:#1B4B45;color:#FFFFFF}
  .sheet .quiet{background:#FFFFFF;color:#1B4B45;border:1.5px solid #DCE3E0}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var KEY = 'trident.appLink';
  var root = document.getElementById('root');
  function get() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function set(v) { try { localStorage.setItem(KEY, v); return true; } catch (e) { return false; } }
  if (/[?&]reset\b/.test(location.search)) { try { localStorage.removeItem(KEY); } catch (e) {} history.replaceState(null, '', location.pathname); }

  // Only the Trident web app's own address is accepted, with its key.
  function clean(raw) {
    var u;
    try { u = new URL(String(raw).trim()); } catch (e) { return null; }
    if (u.protocol !== 'https:' || u.hostname !== 'script.google.com' || !/^\/macros\/s\/[\w-]+\/exec$/.test(u.pathname)) return null;
    if (!u.searchParams.get('k')) return null;
    u.searchParams.set('action', 'app');
    return u.toString();
  }

  function open(link) {
    root.innerHTML = '';
    var f = document.createElement('iframe');
    f.src = link; f.title = 'Trident'; f.allow = 'clipboard-write';
    root.appendChild(f);
  }

  function setup(msg) {
    root.innerHTML = '<main class="setup"><img src="icon-192.png" alt="" style="border-radius:12px">'
      + '<h1>Set up the Trident app on this phone</h1>'
      + '<ol><li>In Apps Script, run EMAIL_ME_MY_LINKS.</li><li>Copy the "Home" link from that email.</li><li>Paste it below. It\'s kept on this phone only.</li></ol>'
      + '<label for="link">Your app link</label><textarea id="link" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec?k=..."></textarea>'
      + (msg ? '<p class="err" role="alert">' + msg + '</p>' : '')
      + '<button id="go">Open the app</button>'
      + '<p>Then add this page to your home screen: in Safari, Share, Add to Home Screen; in Chrome, the menu, Install app or Add to Home screen.</p></main>';
    document.getElementById('go').onclick = function () {
      var link = clean(document.getElementById('link').value);
      if (!link) return setup('That doesn\'t look like your app link. It starts with https://script.google.com/macros/s/ and has k= in it.');
      if (!set(link)) return setup('This browser won\'t keep the link (private browsing?). Open this page in a normal tab and try again.');
      open(link);
    };
  }

  // WhatsApp hand-off (05/10). Links opened from inside the app land in an
  // in-app browser on iPhone, which can't open WhatsApp. The app asks this
  // page instead, and the tap on "Open WhatsApp" here opens it directly.
  // Only WhatsApp links from the Apps Script app are accepted.
  function waUrl(raw) {
    var u; try { u = new URL(String(raw)); } catch (e) { return null; }
    if (u.protocol === 'https:' && (u.hostname === 'wa.me' || u.hostname === 'api.whatsapp.com')) {
      var phone = u.hostname === 'wa.me' ? u.pathname.replace(/\D/g, '') : (u.searchParams.get('phone') || '').replace(/\D/g, '');
      var q = 'text=' + encodeURIComponent(u.searchParams.get('text') || '') + (phone ? '&phone=' + phone : '');
      return { app: 'whatsapp://send?' + q, web: u.toString(), text: u.searchParams.get('text') || '' };
    }
    return null;
  }
  function closeSheet() { var el = document.getElementById('wa'); if (el) el.remove(); }
  function sheet(w) {
    closeSheet();
    var d = document.createElement('div'); d.className = 'sheet'; d.id = 'wa';
    d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-label', 'Send on WhatsApp');
    d.innerHTML = '<div class="box"><h2>Send on WhatsApp</h2><p></p><a id="waGo">Open WhatsApp</a>'
      + '<button class="quiet" id="waCopy">Copy the message</button><button class="quiet" id="waNo">Cancel</button></div>';
    d.querySelector('p').textContent = w.text;
    d.querySelector('#waGo').href = w.app;
    d.querySelector('#waGo').onclick = function () { setTimeout(closeSheet, 600); };
    d.querySelector('#waCopy').onclick = function () {
      var b = this;
      (navigator.clipboard ? navigator.clipboard.writeText(w.text) : Promise.reject()).then(function () { b.textContent = 'Copied: paste it in WhatsApp'; }, function () { b.textContent = 'Couldn\'t copy: press and hold the message to copy it'; });
    };
    d.querySelector('#waNo').onclick = closeSheet;
    d.onclick = function (e) { if (e.target === d) closeSheet(); };
    document.body.appendChild(d);
    d.querySelector('#waGo').focus();
  }
  // The deal pack PDF itself (05/10): a tap here opens the phone's share
  // sheet with the file attached, so it goes into WhatsApp as a document.
  function fileSheet(m) {
    closeSheet();
    var bytes = atob(m.b64), arr = new Uint8Array(bytes.length);
    for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    var blob = new Blob([arr], { type: 'application/pdf' }), file = null, name = String(m.name).replace(/[\\/:*?"<>|]/g, '_');
    try { file = new File([blob], name, { type: 'application/pdf' }); } catch (e) { file = null; }
    var canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
    var text = String(m.text || '');
    var d = document.createElement('div'); d.className = 'sheet'; d.id = 'wa';
    d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-label', 'Send the deal pack');
    d.innerHTML = '<div class="box"><h2>Send the deal pack</h2><p></p>'
      + (canShare ? '<button id="shGo" style="background:#1B4B45;color:#FFFFFF">Share the PDF</button>' : '<a id="shSave">Save the PDF</a>')
      + (text ? '<button class="quiet" id="waCopy">Copy the message</button>' : '') + '<button class="quiet" id="waNo">Cancel</button></div>';
    d.querySelector('p').textContent = (canShare ? 'Pick WhatsApp, then the person or group. ' : 'Save it, then attach it in WhatsApp. ') + name + (text ? '\n\n' + text : '');
    if (canShare) d.querySelector('#shGo').onclick = function () {
      var data = { files: [file] };
      navigator.share(data).then(closeSheet, function (e) { if (e && e.name !== 'AbortError') d.querySelector('p').textContent = 'Couldn\'t open sharing: ' + (e.message || e); });
    };
    else { var a = d.querySelector('#shSave'); a.href = URL.createObjectURL(blob); a.download = name; }
    var cp = d.querySelector('#waCopy');
    if (cp) cp.onclick = function () { var b = this; (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { b.textContent = 'Copied: paste it with the PDF'; }, function () { b.textContent = 'Couldn\'t copy'; }); };
    d.querySelector('#waNo').onclick = closeSheet;
    d.onclick = function (e) { if (e.target === d) closeSheet(); };
    document.body.appendChild(d);
    (d.querySelector('#shGo') || d.querySelector('#shSave')).focus();
  }

  window.addEventListener('message', function (e) {
    var host = ''; try { host = new URL(e.origin).hostname; } catch (x) { return; }
    if (!/(^|\.)googleusercontent\.com$/.test(host) && host !== 'script.google.com') return;
    var m = e.data || {};
    if (m.trident === 'hello' && e.source) e.source.postMessage({ trident: 'launcher' }, e.origin);
    else if (m.trident === 'whatsapp') { var w = waUrl(m.url); if (w) sheet(w); }
    else if (m.trident === 'sharefile' && typeof m.b64 === 'string' && /\.pdf$/i.test(String(m.name || '')) && m.b64.length < 30000000) fileSheet(m);
  });

  var saved = clean(get());
  if (saved) open(saved); else setup('');
})();
</script>
</body>
</html>
